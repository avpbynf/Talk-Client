[package]
name = "t4lk"
version = "0.4.0"
description = "T4lk — Speech-to-Text desktop client"
authors = ["avpbynf"]
edition = "2021"

[lib]
name = "t4lk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

# Whisper transcription (with optional GPU/NPU acceleration)
whisper-rs = "0.16"

# Audio capture
cpal = "0.15"

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP for model download and server transcription
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }

# WAV encoding for server transcription
hound = "3.5"

# Utilities
num_cpus = "1"
directories = "5"
thiserror = "1"
parking_lot = "0.12"
dotenvy = "0.15"
url = "2"
# Windows clipboard/input
[target.'cfg(windows)'.dependencies]
enigo = "0.2"
clipboard-win = "5"
windows = { version = "0.62", features = [
    "Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["vulkan"]
vulkan = ["whisper-rs/vulkan"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

