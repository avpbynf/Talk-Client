<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <!-- Abstract flowing wave - represents voice/whisper flowing -->
  <path d="M100 256
           C140 200, 180 180, 220 200
           C260 220, 280 280, 320 256
           C360 232, 380 180, 412 256"
        fill="none"
        stroke="url(#wave)"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Second wave layer for depth -->
  <path d="M120 300
           C160 340, 200 360, 256 340
           C312 320, 352 280, 392 300"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.5"
        stroke-width="24"
        stroke-linecap="round"/>

  <!-- Accent dot - like a starting point of speech -->
  <circle cx="100" cy="256" r="18" fill="#ffffff"/>
</svg>
